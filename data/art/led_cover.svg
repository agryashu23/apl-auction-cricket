<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="928" viewBox="0 0 2400 928">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1236"/>
      <stop offset="0.55" stop-color="#3a0b2e"/>
      <stop offset="1" stop-color="#6d0d1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.42">
      <stop offset="0" stop-color="#ffcf5a" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#e3782b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e3782b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#f2b640"/>
      <stop offset="1" stop-color="#b9781c"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ff6b5a"/>
      <stop offset="0.55" stop-color="#c3141e"/>
      <stop offset="1" stop-color="#5c0610"/>
    </radialGradient>
    <linearGradient id="bat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d9a0"/>
      <stop offset="0.5" stop-color="#e8bf78"/>
      <stop offset="1" stop-color="#b98a45"/>
    </linearGradient>
  </defs>

  <rect width="2400" height="928" fill="url(#sky)"/>

  <!-- Rays behind the crest -->
  <g transform="translate(1200 420)" opacity="0.18" fill="#ffd77a">
    <path d="M0 0 L-60 -900 L60 -900 Z"/>
    <path d="M0 0 L-60 -900 L60 -900 Z" transform="rotate(20)"/>
    <path d="M0 0 L-60 -900 L60 -900 Z" transform="rotate(40)"/>
    <path d="M0 0 L-60 -900 L60 -900 Z" transform="rotate(60)"/>
    <path d="M0 0 L-60 -900 L60 -900 Z" transform="rotate(80)"/>
    <path d="M0 0 L-60 -900 L60 -900 Z" transform="rotate(-20)"/>
    <path d="M0 0 L-60 -900 L60 -900 Z" transform="rotate(-40)"/>
    <path d="M0 0 L-60 -900 L60 -900 Z" transform="rotate(-60)"/>
    <path d="M0 0 L-60 -900 L60 -900 Z" transform="rotate(-80)"/>
  </g>
  <rect width="2400" height="928" fill="url(#glow)"/>

  <!-- Floodlight towers with beams -->
  <g>
    <polygon points="250,120 120,928 720,928" fill="url(#beam)" opacity="0.35"/>
    <polygon points="2150,120 1680,928 2280,928" fill="url(#beam)" opacity="0.35"/>
    <g fill="#060914">
      <rect x="238" y="150" width="24" height="700"/>
      <rect x="2138" y="150" width="24" height="700"/>
      <rect x="170" y="70" width="160" height="90" rx="6"/>
      <rect x="2070" y="70" width="160" height="90" rx="6"/>
    </g>
    <g fill="#fff3c4">
      <circle cx="195" cy="95" r="11"/><circle cx="230" cy="95" r="11"/><circle cx="265" cy="95" r="11"/><circle cx="300" cy="95" r="11"/>
      <circle cx="195" cy="132" r="11"/><circle cx="230" cy="132" r="11"/><circle cx="265" cy="132" r="11"/><circle cx="300" cy="132" r="11"/>
      <circle cx="2095" cy="95" r="11"/><circle cx="2130" cy="95" r="11"/><circle cx="2165" cy="95" r="11"/><circle cx="2200" cy="95" r="11"/>
      <circle cx="2095" cy="132" r="11"/><circle cx="2130" cy="132" r="11"/><circle cx="2165" cy="132" r="11"/><circle cx="2200" cy="132" r="11"/>
    </g>
  </g>

  <!-- Stadium bowl silhouette -->
  <path d="M0 760 Q 300 690 600 720 T 1200 700 T 1800 720 T 2400 760 L2400 928 L0 928 Z" fill="#070a18" opacity="0.92"/>
  <path d="M0 820 Q 600 770 1200 790 T 2400 820 L2400 928 L0 928 Z" fill="#03050d"/>
  <g fill="#ffe7a3" opacity="0.35">
    <circle cx="420" cy="735" r="3"/><circle cx="520" cy="728" r="2"/><circle cx="700" cy="718" r="3"/><circle cx="880" cy="712" r="2"/>
    <circle cx="1520" cy="712" r="2"/><circle cx="1690" cy="718" r="3"/><circle cx="1880" cy="728" r="2"/><circle cx="1990" cy="735" r="3"/>
  </g>

  <!-- Cricket ball, left -->
  <g transform="translate(560 420)">
    <circle r="150" fill="url(#ball)"/>
    <path d="M-60 -138 C -10 -60, -10 60, -60 138" stroke="#f4e6c8" stroke-width="7" fill="none"/>
    <path d="M-30 -146 C 20 -60, 20 60, -30 146" stroke="#f4e6c8" stroke-width="7" fill="none"/>
    <g stroke="#f4e6c8" stroke-width="4">
      <path d="M-68 -100 l22 6"/><path d="M-56 -60 l22 4"/><path d="M-50 -20 l22 2"/><path d="M-50 20 l22 -2"/><path d="M-56 60 l22 -4"/><path d="M-68 100 l22 -6"/>
    </g>
    <ellipse cx="-50" cy="-60" rx="40" ry="24" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- Crossed bats and stumps, right -->
  <g transform="translate(1840 430)">
    <g fill="url(#gold)" opacity="0.95">
      <rect x="-30" y="-190" width="16" height="330" rx="6"/>
      <rect x="-8" y="-190" width="16" height="330" rx="6"/>
      <rect x="14" y="-190" width="16" height="330" rx="6"/>
      <rect x="-36" y="-202" width="34" height="9" rx="4"/>
      <rect x="2" y="-202" width="34" height="9" rx="4"/>
    </g>
    <g transform="rotate(-28)">
      <rect x="-26" y="-250" width="16" height="120" rx="7" fill="#3a2410"/>
      <path d="M-44 -132 L8 -132 L12 150 Q -18 175 -48 150 Z" fill="url(#bat)"/>
    </g>
    <g transform="rotate(28)">
      <rect x="10" y="-250" width="16" height="120" rx="7" fill="#3a2410"/>
      <path d="M-8 -132 L44 -132 L48 150 Q 18 175 -12 150 Z" fill="url(#bat)"/>
    </g>
  </g>

  <!-- Crest -->
  <image x="900" y="70" width="600" height="600" xlink:href="CREST_DATA_URI"/>

  <text x="1200" y="755" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="74" letter-spacing="18" fill="url(#gold)">PLAYER AUCTION 2026</text>

  <!-- Sparkles -->
  <g fill="#ffffff">
    <circle cx="980" cy="110" r="4" opacity="0.8"/><circle cx="1430" cy="150" r="3" opacity="0.7"/><circle cx="860" cy="300" r="2.5" opacity="0.6"/>
    <circle cx="1560" cy="300" r="3.5" opacity="0.7"/><circle cx="1100" cy="60" r="2" opacity="0.6"/><circle cx="1320" cy="80" r="3" opacity="0.7"/>
    <circle cx="760" cy="180" r="2" opacity="0.5"/><circle cx="1650" cy="200" r="2" opacity="0.5"/>
  </g>
</svg>
